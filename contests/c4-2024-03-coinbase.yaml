notes: >-
  ERC-4337 smart wallet (CoinbaseSmartWallet, UUPS-upgradeable, deployed via CoinbaseSmartWalletFactory) with
  multiple owners (MultiOwnable): owners are Ethereum addresses or secp256r1 passkeys (WebAuthn verified with
  FreshCryptoLib). Signatures are ERC-1271 with replay-safe hashing. validateUserOp normally binds the chain id;
  executeWithoutChainIdValidation (EntryPoint only) lets whitelisted owner-management/upgrade calls
  (canSkipChainIdValidation) be signed once and replayed on every chain to keep owners in sync. MagicSpend is
  a Coinbase-run paymaster/withdraw contract: users present Coinbase-signed WithdrawRequests to withdraw ETH or
  pay gas for a user operation. Deployed to Ethereum, Base, Optimism, Arbitrum, Polygon, BNB, Avalanche,
  Gnosis. Roles: wallet owners or the wallet itself manage owners and upgrades; only EntryPoint calls
  executeWithoutChainIdValidation and validateUserOp; MagicSpend owner (Coinbase) signs withdraw requests
  and calls ownerWithdraw/entryPoint* functions. Known issues (not eligible): cross-chain replay relies on
  gas values from one chain being accepted on others; WebAuthn knowingly skips some validation steps
  (see WebAuthn.sol comments); FCL issues only count via ecdsa_verify, and two previously reported FCL bugs
  (ecAff_isOnCurve condition; ecZZ_mulmuladd_S_asm infinite loop for (-Gx,-Gy)); as a paymaster EntryPoint
  debits MagicSpend slightly more than actualGasCost; validatePaymasterUserOp reads address.balance,
  violating ERC-7562.
