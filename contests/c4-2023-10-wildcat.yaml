notes: >-
  Wildcat is an on-chain fixed-rate private credit protocol for sophisticated users. The archcontroller
  registers allowed factories, controllers, markets and borrowers. Borrowers deploy markets through
  controllers (deployed by WildcatMarketControllerFactory), which constrain market parameters to factory
  ranges and manage the set of authorised lenders. Lenders deposit the market's asset and receive a rebasing
  market token redeemable 1:1 for the asset; interest accrues as base APR + protocol fee (a share of base APR)
  + penalty APR once the market has been delinquent (below its reserve ratio) beyond the grace period, tracked
  by a grace tracker. Borrowers may borrow only down to the reserve ratio, can adjust APR (lowering it
  temporarily raises the reserve ratio to 90%) and capacity via the controller, and can close the market.
  Lenders with WithdrawOnly or DepositAndWithdraw roles queue withdrawals into time-boxed batches; unpaid
  batch amounts expire into a FIFO queue paid first from any new reserves. Lenders flagged by the Chainalysis
  sanctions oracle are blocked and their balances moved to an escrow (WildcatSanctionsSentinel /
  WildcatSanctionsEscrow) from which they can recover funds if unflagged. No proxies; the archcontroller
  owner is trusted. Anything in the bot report is a known issue.
