notes: >-
  Basin is a composable AMM framework. A Well is a constant-function AMM holding n tokens' reserves, defined by
  a Well function (here ConstantProduct2 for 2 tokens, with ProportionalLPToken2 for LP math) and optional
  Pumps (on-chain oracles). Wells issue ERC20 LP tokens and support swapFrom/swapTo, add/remove liquidity
  (incl. fee-on-transfer variants), shift (swap tokens already sent to the Well), sync and skim. Every
  reserve-changing action must update the Pumps first so oracle values reflect the pre-change reserves.
  MultiFlowPump stores a geometric EMA and a cumulative geometric SMA per reserve, capping reserve changes per
  block (maxPercentIncrease/Decrease, BLOCK_TIME) to resist manipulation; reserves are packed into storage
  with LibBytes / LibBytes16 / LibLastReserveBytes. Aquifer is a permissionless Well registry/factory that
  bores Wells as immutable clones. Basin has no admin roles in scope. Wells are not required to be deployed by
  the Aquifer; evaluating a Well's trustworthiness is left to users.
