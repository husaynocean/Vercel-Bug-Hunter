notes: >-
  Particle LAMM enables permissionless leverage trading for any ERC20 by borrowing concentrated liquidity from
  Uniswap V3. LPs deposit Uniswap V3 position NFTs into ParticlePositionManager (mint / onERC721Received) and
  can increase, decrease, collect and reclaim liquidity; reclaimLiquidity starts a renewal cutoff after which
  borrowers' loans can be liquidated once the loan term expires. Traders openPosition: borrow liquidity from
  an LP position (a lien), swap via the dex aggregator with user-supplied swap data, post margin and token
  premiums that pay the LP's fees over time; addPremium tops up premiums; closePosition repays by re-adding
  the borrowed liquidity; liquidatePosition lets anyone close an underwater or expired position for a
  liquidation reward. Fees owed to the LP are computed from Uniswap V3 feeGrowthInside snapshots at open.
  The owner sets the dex aggregator, fee factor, liquidation reward factor, loan term and treasury rate and
  is trusted. Deployed on Ethereum mainnet first.
