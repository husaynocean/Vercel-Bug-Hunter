[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bughunter"
version = "0.1.0"
description = "AI-assisted smart-contract bug hunter for audit contests (in-scope code only)"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "slither-analyzer>=0.10",
  "semgrep>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bughunter = "bughunter.cli:main"

[tool.setuptools.packages.find]
include = ["bughunter*"]
